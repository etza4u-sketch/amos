<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פרשת השבוע</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8d5a3;
      --gold-dim: rgba(201,168,76,0.15);
      --dark: #0d1420;
      --dark2: #111927;
      --card: #161f2e;
      --card2: #1b2638;
      --white: #ffffff;
      --text: rgba(255,255,255,0.88);
      --muted: rgba(255,255,255,0.5);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      direction: rtl;
      line-height: 1.7;
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 80px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 65%),
                  linear-gradient(180deg, #0d1420 0%, #111927 100%);
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9a84c' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      pointer-events: none;
    }

    .date-badge {
      display: inline-block;
      border: 1px solid rgba(201,168,76,0.4);
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 1.5px;
      padding: 6px 20px;
      border-radius: 50px;
      margin-bottom: 24px;
      background: var(--gold-dim);
    }

    .label {
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .parasha-name {
      font-size: clamp(4rem, 14vw, 9rem);
      font-weight: 900;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 16px;
      text-shadow: 0 0 80px rgba(201,168,76,0.3);
      position: relative;
    }

    .parasha-en {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: var(--gold-light);
      font-weight: 300;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .parasha-book {
      font-size: clamp(0.85rem, 2vw, 1rem);
      color: var(--muted);
      margin-bottom: 36px;
    }

    .chapters-pill {
      display: inline-block;
      background: var(--gold-dim);
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--gold-light);
      padding: 8px 24px;
      border-radius: 50px;
      font-size: 0.95rem;
      margin-bottom: 48px;
    }

    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font-size: 0.75rem;
      letter-spacing: 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .scroll-hint::after {
      content: '↓';
      animation: bounce 1.6s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    /* ── CONTENT ── */
    .content {
      max-width: 860px;
      margin: 0 auto;
      padding: 60px 24px 100px;
    }

    .section-title {
      font-size: 0.8rem;
      letter-spacing: 2.5px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }

    /* ── SUMMARY ── */
    .summary-card {
      background: var(--card);
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 16px;
      padding: 32px 36px;
      margin-bottom: 36px;
    }

    .summary-theme {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 16px;
    }

    .summary-text {
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.9;
    }

    /* ── HIGHLIGHTS ── */
    .highlights {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }

    .highlight-card {
      background: var(--card);
      border: 1px solid rgba(201,168,76,0.12);
      border-radius: 12px;
      padding: 24px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .highlight-card:hover {
      border-color: rgba(201,168,76,0.35);
      transform: translateY(-2px);
    }

    .highlight-num {
      font-size: 1.8rem;
      color: rgba(201,168,76,0.25);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 10px;
    }

    .highlight-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 6px;
    }

    .highlight-desc {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── ALIYOT ── */
    .aliyot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 36px;
    }

    .aliya {
      background: var(--card);
      border: 1px solid rgba(201,168,76,0.1);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
      font-size: 0.82rem;
    }

    .aliya-num {
      display: block;
      color: var(--gold);
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .aliya-ref {
      color: var(--muted);
      font-size: 0.78rem;
    }

    /* ── CTA ── */
    .cta-section {
      text-align: center;
      padding: 48px 0 0;
      border-top: 1px solid rgba(201,168,76,0.1);
    }

    .cta-section p {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .btn {
      display: inline-block;
      background: var(--gold);
      color: #0d1420;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px 36px;
      border-radius: 50px;
      text-decoration: none;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }

    .btn:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(201,168,76,0.25);
    }

    .btn-outline {
      display: inline-block;
      border: 1px solid rgba(201,168,76,0.4);
      color: var(--gold);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 12px 28px;
      border-radius: 50px;
      text-decoration: none;
      margin-right: 12px;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-outline:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
    }

    /* ── NOT FOUND ── */
    .not-found {
      text-align: center;
      padding: 80px 24px;
      color: var(--muted);
    }

    .not-found h2 { color: var(--gold); font-size: 2rem; margin-bottom: 16px; }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 32px 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .summary-card { padding: 24px 20px; }
      .highlights { grid-template-columns: 1fr; }
      .aliyot-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>

<section class="hero" id="hero">
  <div class="date-badge" id="dateBadge">שבת</div>
  <div class="label">פרשת השבוע</div>
  <div class="parasha-name" id="parshaName">—</div>
  <div class="parasha-en" id="parshaEn"></div>
  <div class="parasha-book" id="parshaBook"></div>

<script>
// ─── Hebrew Calendar ───────────────────────────────────────────────
const HEBREW_EPOCH = -1373427;

function isGregorianLeap(y) {
  return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0);
}

function fixedFromGregorian(y, m, d) {
  const yy = y - 1;
  return 365 * yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400)
    + Math.floor((367*m - 362)/12)
    + (m <= 2 ? 0 : isGregorianLeap(y) ? -1 : -2)
    + d;
}

function hebrewElapsedDays(year) {
  const m = Math.floor((235*year - 234) / 19);
  const parts = 12084 + 13753 * m;
  let day = 29 * m + Math.floor(parts / 25920);
  if ((3 * (day+1)) % 7 < 3) day++;
  return day;
}

function hebrewNewYear(year) {
  const e = hebrewElapsedDays(year);
  const e0 = hebrewElapsedDays(year - 1);
  const e1 = hebrewElapsedDays(year + 1);
  let c = 0;
  if (e1 - e === 356) c = 2;
  else if (e - e0 === 382) c = 1;
  return HEBREW_EPOCH + e + c;
}

function isHebrewLeap(y) { return (7*y + 1) % 19 < 7; }
function daysInYear(y) { return hebrewNewYear(y+1) - hebrewNewYear(y); }
function longCheshvan(y) { return daysInYear(y) % 10 === 5; }
function shortKislev(y)  { return daysInYear(y) % 10 === 3; }

function monthLen(m, y) {
  if ([2,4,6,10,13].includes(m)) return 29;
  if (m === 8 && !longCheshvan(y)) return 29;
  if (m === 9 && shortKislev(y))   return 29;
  if (m === 12 && !isHebrewLeap(y)) return 29;
  return 30;
}

function fixedFromHebrew(y, m, d) {
  let r = hebrewNewYear(y) + d - 1;
  const last = isHebrewLeap(y) ? 13 : 12;
  if (m < 7) {
    for (let i = 7; i <= last; i++) r += monthLen(i, y);
    for (let i = 1; i < m; i++) r += monthLen(i, y);
  } else {
    for (let i = 7; i < m; i++) r += monthLen(i, y);
  }
  return r;
}

function hebrewFromFixed(date) {
  let year = Math.round((date - HEBREW_EPOCH) / 365.25);
  while (hebrewNewYear(year) > date) year--;
  while (hebrewNewYear(year+1) <= date) year++;
  const start = date < fixedFromHebrew(year, 1, 1) ? 7 : 1;
  const last = isHebrewLeap(year) ? 13 : 12;
  let month = start;
  while (date > fixedFromHebrew(year, month, monthLen(month, year))) {
    month++;
    if (month > last) break;
  }
  return { year, month, day: date - fixedFromHebrew(year, month, 1) + 1 };
}

// ─── Hebrew Display ────────────────────────────────────────────────
const HE_MONTHS = ['','ניסן','אייר','סיון','תמוז','אב','אלול',
  'תשרי','חשוון','כסלו','טבת','שבט','אדר','אדר ב\''];

function numToGematria(n) {
  if (n === 15) return 'ט"ו';
  if (n === 16) return 'ט"ז';
  const o = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const t = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  let s = '';
  if (n >= 10) { s += t[Math.floor(n/10)]; n %= 10; }
  if (n > 0)   s += o[n];
  return s.length === 1 ? s + "'" : s.slice(0,-1) + '"' + s.slice(-1);
}

function yearToHebrew(year) {
  const th = ['','א','ב','ג','ד','ה'];
  const thousands = Math.floor(year / 1000);
  let r = year % 1000;
  const h = ['','ק','ר','ש'];
  const t = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const o = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  let s = '';
  if (r >= 400) { s += 'ת'; r -= 400; }
  if (r >= 400) { s += 'ת'; r -= 400; }
  if (r >= 100) { s += h[Math.floor(r/100)]; r %= 100; }
  if (r >= 10)  { s += t[Math.floor(r/10)]; r %= 10; }
  if (r > 0)    s += o[r];
  if (s.length > 1) s = s.slice(0,-1) + '"' + s.slice(-1);
  else s += "'";
  return th[thousands] + "'" + s;
}

function formatHebrewDate(fixedDay) {
  const { year, month, day } = hebrewFromFixed(fixedDay);
  return `${numToGematria(day)} ב${HE_MONTHS[month]} ${yearToHebrew(year)}`;
}

// ─── Main Logic ────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2,'0'); }

function getShabbat() {
  const now = new Date();
  const day = now.getDay(); // 0=Sun … 6=Sat
  const diff = (6 - day + 7) % 7;
  const sh = new Date(now);
  sh.setDate(now.getDate() + diff);
  return sh;
}

function dateKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function render() {
  const shabbat = getShabbat();
  const key = dateKey(shabbat);
  const parshaKey = SCHEDULE[key];
  const data = parshaKey ? PARASHA[parshaKey] : null;

  // Hebrew date
  const fixedToday = fixedFromGregorian(shabbat.getFullYear(), shabbat.getMonth()+1, shabbat.getDate());
  const heDate = hebrewFromFixed(fixedToday);
  const heDateStr = `שבת ${numToGematria(heDate.day)} ב${HE_MONTHS[heDate.month]} ${yearToHebrew(heDate.year)}`;
  document.getElementById('dateBadge').textContent = heDateStr;

  if (!data) {
    document.getElementById('notFound').style.display = '';
    return;
  }

  // Hero
  document.getElementById('parshaName').textContent = parshaKey;
  document.getElementById('parshaEn').textContent = data.en;
  document.getElementById('parshaBook').textContent = `ספר ${data.book} • ${data.bookEn}`;
  document.getElementById('chaptersPill').textContent = `פרקים ${data.chapters}`;
  document.title = `פרשת ${parshaKey} — פרשת השבוע`;

  // Content
  document.getElementById('summaryTheme').textContent = data.theme;
  document.getElementById('summaryText').textContent = data.summary;

  // Points
  const hl = document.getElementById('highlights');
  data.points.forEach((p, i) => {
    const c = document.createElement('div');
    c.className = 'highlight-card';
    c.innerHTML = `<div class="highlight-num">${'אבג'[i]}</div>
      <div class="highlight-title">${p.title}</div>
      <div class="highlight-desc">${p.desc}</div>`;
    hl.appendChild(c);
  });

  // Aliyot
  const aliyotLabels = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שביעי'];
  const ag = document.getElementById('aliyotGrid');
  (data.aliyot || []).forEach((ref, i) => {
    const d = document.createElement('div');
    d.className = 'aliya';
    d.innerHTML = `<span class="aliya-num">${aliyotLabels[i]}</span>
      <span class="aliya-ref">${ref}</span>`;
    ag.appendChild(d);
  });

  // Sefaria link
  const sefName = encodeURIComponent(data.en.split(' ')[0]);
  document.getElementById('sefariaSingle').href =
    `https://www.sefaria.org.il/${sefName}?lang=he`;

  document.getElementById('mainContent').style.display = '';
}

render();
